<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CleanLink · Report</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="top">
    <a class="brand" href="./">CleanLink</a>
    <nav><a href="./">Home</a><a href="report.html" aria-current="page">Report</a><a href="donate.html">Donate</a><a href="moderate.html">Moderate</a><a href="work.html">Work</a></nav>
  </header>

  <h1>Report</h1>
  <p class="lead">Upload a photo of the waste. Its GPS gives the city and locality. If the photo has
     no GPS, type the latitude and longitude. A moderator checks every report before it can be funded.</p>

  <form class="form" id="form">
    <label>Photo
      <input type="file" name="photo" id="photo" accept="image/jpeg,image/*">
    </label>
    <img class="thumb" id="thumb" alt="Selected photo" hidden>

    <label>Waste type
      <input name="wasteType" placeholder="plastic" required>
    </label>

    <fieldset>
      <legend>Size (workers needed)</legend>
      <div class="sizes">
        <label><input type="radio" name="size" value="0" required><span>Small<small>2</small></span></label>
        <label><input type="radio" name="size" value="1"><span>Medium<small>5</small></span></label>
        <label><input type="radio" name="size" value="2"><span>Large<small>10</small></span></label>
      </div>
    </fieldset>

    <div class="row gps" id="gps">
      <label>Latitude (photo had no GPS)
        <input name="latitude" type="number" step="any" placeholder="19.0760">
      </label>
      <label>Longitude
        <input name="longitude" type="number" step="any" placeholder="72.8777">
      </label>
    </div>

    <div class="submit">
      <button id="send">Report spot</button>
      <span class="msg" id="msg"></span>
    </div>
  </form>

  <section class="spots">
    <h2>Open waste spots</h2>
    <ul class="list" id="list"></ul>
    <div class="detail" id="detail"></div>
  </section>

</div>

<script src="common.js"></script>
<script>
  const form = document.getElementById('form');
  const photo = document.getElementById('photo');
  const thumb = document.getElementById('thumb');
  const msg = document.getElementById('msg');
  const send = document.getElementById('send');
  // Cleaned spots are finished, so they are left out here (they are on the home page)
  const browser = spotBrowser({
    filter: s => !isFinished(s),
    empty: 'No open spots right now. Cleaned spots are on the home page.',
  });

  photo.addEventListener('change', () => {
    const file = photo.files[0];
    thumb.hidden = !file;
    if (file) thumb.src = URL.createObjectURL(file);
    document.getElementById('gps').classList.remove('show');
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!photo.files[0]) { msg.textContent = 'Upload a photo first.'; return; }

    send.disabled = true;
    msg.textContent = 'Reading location…';

    try {
      const res = await fetch('/api/report', { method: 'POST', body: new FormData(form) });
      const data = await res.json();

      if (!res.ok) {
        msg.textContent = data.error;
        if (data.error.includes('GPS')) document.getElementById('gps').classList.add('show');
        return;
      }

      msg.textContent = `Spot #${data.id} reported: ${data.city || 'unknown city'}, ${data.locality || '—'}`;
      form.reset();
      thumb.hidden = true;
      document.getElementById('gps').classList.remove('show');
      await browser.load(data.id);
    } catch {
      msg.textContent = 'Could not reach the server. Is it running?';
    } finally {
      send.disabled = false;
    }
  });

  me.then(user => { if (user?.role !== 'user') msg.textContent = 'Log in as a user to report a spot.'; });
  browser.load();
</script>
</body>
</html>
